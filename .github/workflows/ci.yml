name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo build --target wasm32v1-none --release

  bindings:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt || true
      - name: Verify TypeScript Bindings Generation
        run: |
          chmod +x scripts/generate-bindings.sh
          ./scripts/generate-bindings.sh

  sdk-and-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test SDK
        run: |
          cd sdk-ts
          npm test
      - name: Test Indexer
        run: |
          cd indexer
          npm test
      - name: Test Frontend
        run: |
          cd frontend
          npm test
